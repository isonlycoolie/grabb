<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>grabb</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/sidebar.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/download.css">
  <link rel="stylesheet" href="styles/jobs.css">
  <link rel="stylesheet" href="styles/player.css">
  <link rel="stylesheet" href="styles/pages.css">
  <script src="scripts/theme.js"></script>
  <script type="module" src="scripts/main.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Main">
      <div class="brand">
        <img src="assets/logo.svg" alt="" width="20" height="20">
        <span>grabb</span>
        <small id="version"></small>
      </div>
      <nav class="nav">
        <div class="nav-label">Workspace</div>
        <a href="#/download" data-route="download" data-icon="download">Download</a>
        <a href="#/library" data-route="library" data-icon="library">Library <span class="count" id="library-count"></span></a>
      </nav>
      <div class="nav sidebar-foot">
        <a href="#/settings" data-route="settings" data-icon="settings">Settings</a>
        <a href="https://github.com/isonlycoolie/grabb" target="_blank" rel="noopener" data-icon="external">Source code</a>
        <p class="made-by">Built by <a href="https://github.com/isonlycoolie" target="_blank" rel="noopener">isonlycoolie</a></p>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <div class="main">
      <header class="topbar">
        <button class="btn btn-ghost icon-button menu-button" id="menu" type="button" aria-label="Open menu" data-icon="menu"></button>
        <div class="crumbs" id="crumbs"></div>
      </header>
      <main class="page" id="page"></main>
    </div>
  </div>
</body>
</html>
