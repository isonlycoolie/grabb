name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Example link
      description: A public link that shows the problem, if there is one.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Paste the link
        2. Choose 1080p
        3. Press Download
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: grabb, yt-dlp and ffmpeg, as shown on the Settings page.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
